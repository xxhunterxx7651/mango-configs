[audio]
colorize_icons = true

[bar.default]
capsule = true
capsule_foreground = "primary"
capsule_opacity = 0.0
capsule_radius = 0
capsule_thickness = 0.99999998137354851
center = [ "audio_visualizer" ]
end = [ "battery", "textwws" ]
font_family = "Iosevka NF"
margin_ends = 100
padding = 0
panel_overlap = 0
position = "bottom"
radius = 0
shadow = false
start = [ "workspaces" ]
thickness = 25
widget_spacing = 2

[calendar]
enabled = true

[control_center]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
colorize_icons = true
icon_size = 24
radius = 0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

