[notification]
colorize_icons = true

[shell]
app_icon_color = "primary"
avatar_path = "/home/buck/.BuckV3.3.1.webp"
button_borders = false
card_borders = false
corner_radius_scale = 0.0
font_family = "Iosevka Nerd Font"
input_borders = false
polkit_colorize_icons = true
popup_borders = false
screen_time_colorize_icons = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    categories = false
    colorize_icons = true
    compact = true
    ignore_mouse = true
    layout = "simple"
    show_icons = false

    [shell.panel]
    clipboard_position = "top_left"
    control_center_placement = "floating"
    control_center_position = "center"
    open_near_click_wallpaper = true
    polkit_position = "top_right"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/chita/Pictures/Screenshots"

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

    [shell.window_switcher]
    colorize_icons = true

[theme]
builtin = "Rosé Pine"
community_palette = "Shien"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
terminal_colors = "standard"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "mango" ]
    community_ids = [ "neovim" ]

[wallpaper]
directory = "/home/chita/Pictures/Wallpapers"
fill_color = "primary"

    [wallpaper.default]
    path = "/home/chita/Pictures/Wallpapers/wallhaven-jelp3p_1920x1080.png"

    [wallpaper.last]
    path = "/home/chita/Pictures/Wallpapers/wallhaven-jelp3p_1920x1080.png"

    [wallpaper.monitor.eDP-1]
    fill_color = "primary"

    [wallpaper.monitors.eDP-1]
    path = "/home/chita/Pictures/Wallpapers/wallhaven-jelp3p_1920x1080.png"

[widget.active_window]
capsule = false
colorize_icons = true
display = "icon_only"
min_length = 0

[widget.battery]
display_mode = "glyph"

[widget.brightness]
show_label = false

[widget.clock]
capsule_radius = "auto"
font_weight = 900

[widget.network]
show_label = false

[widget.taskbar]
colorize_icons = true

[widget.textwws]
text = "Gentoo | MangoWM"
type = "text"

[widget.tray]
colorize_icons = true

[widget.workspaces]
