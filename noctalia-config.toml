[audio]
colorize_icons = true

[bar.default]
capsule = true
capsule_foreground = "primary"
capsule_opacity = 0.0
capsule_radius = 0
capsule_thickness = 0.99999998137354851
end = [ "active_window", "battery", "cpu", "temp" ]
font_family = "GoMono Nerd Font Propo"
margin_ends = 0
padding = 0
panel_overlap = 0
radius = 0
shadow = true
start = [ "workspaces", "clipboard" ]
thickness = 19
widget_spacing = 2

[calendar]
enabled = true

[control_center]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
colorize_icons = true
icon_size = 24
radius = 0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@WL-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 472.0
    cy = 854.0
    output = "WL-1"
    placement_height = 1036.0
    placement_width = 944.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
colorize_icons = true

[shell]
app_icon_color = "primary"
avatar_path = "/home/buck/.BuckV3.3.1.webp"
corner_radius_scale = 0.0
font_family = "GoMono Nerd Font"
polkit_colorize_icons = true
screen_time_colorize_icons = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    categories = false
    colorize_icons = true
    compact = true
    ignore_mouse = true
    layout = "simple"
    show_icons = false

    [shell.panel]
    clipboard_position = "top_left"
    control_center_placement = "floating"
    control_center_position = "center"
    open_near_click_wallpaper = true
    polkit_position = "top_right"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/buck/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [shell.window_switcher]
    colorize_icons = true

[theme]
builtin = "Rosé Pine"
community_palette = "Solarized"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "mango" ]
    community_ids = [ "neovim", "fastfetch" ]

[wallpaper]
directory = "/home/buck/Pictures/Wallpapers"
fill_color = "primary"

    [wallpaper.default]
    path = "/home/buck/Pictures/Wallpapers/wallhaven-d8vvlo_1920x1080.png"

    [wallpaper.last]
    path = "/home/buck/Pictures/Wallpapers/wallhaven-d8vvlo_1920x1080.png"

    [wallpaper.monitor.eDP-1]
    fill_color = "primary"

    [wallpaper.monitors.eDP-1]
    path = "/home/buck/Pictures/Wallpapers/wallhaven-d8vvlo_1920x1080.png"

[widget.active_window]
capsule = false
display = "icon_only"
min_length = 0

[widget.battery]
display_mode = "none"

[widget.brightness]
show_label = false

[widget.clock]
capsule_radius = "auto"
font_weight = 900

[widget.control-center]
custom_image = "/home/buck/Pictures/gentoo-signet.png"
font_scale = 1.01
scale = 0.80000000000000004

[widget.network]
show_label = false

[widget.taskbar]
colorize_icons = true

[widget.tray]
colorize_icons = true

[widget.workspaces]
active_pill_size = 1.2
change_color_on_hover = false
colorize_icons = true
empty_color = "outline_variant"
inactive_pill_size = 0.5
style = "minimal"
